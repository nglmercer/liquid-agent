[workspace]
members = ["crates/liquid-core", "crates/liquid-guardian", "crates/liquid-inference", "crates/liquid-server"]
default-members = ["crates/liquid-server"]
exclude = ["crates/liquid-desktop"]
resolver = "2"

# Unoptimised tensor kernels make debug builds (`npm run dev`, `cargo run`) generate many times slower than release.
# Optimise only the crates that hold the inference hot loops, so the app's own code still builds quickly.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.mistralrs-quant]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
